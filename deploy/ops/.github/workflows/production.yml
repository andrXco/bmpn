name: BPMN production

on:
  workflow_dispatch:
    inputs:
      backend_image:
        description: Complete backend digest from a successful staging run
        required: true
        type: string
      front_image:
        description: Complete frontend digest from the same staging run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bmpn-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, Linux, X64, bmpn-production]
    environment: production
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Back up PostgreSQL and deploy the approved images
        env:
          GHCR_TOKEN: ${{ github.token }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          FRONT_IMAGE: ${{ inputs.front_image }}
        run: bash production.sh
