name: BPMN staging

on:
  workflow_dispatch:
    inputs:
      backend_sha:
        description: Full commit SHA from andrXco/bmpn
        required: true
        type: string
      front_sha:
        description: Full commit SHA from andrXco/bmpn-react
        required: true
        type: string

concurrency:
  group: bmpn-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.images.outputs.backend }}
      front: ${{ steps.images.outputs.front }}
    steps:
      - name: Check release inputs
        env:
          BACKEND_SHA: ${{ inputs.backend_sha }}
          FRONT_SHA: ${{ inputs.front_sha }}
        run: |
          [[ "$BACKEND_SHA" =~ ^[a-f0-9]{40}$ && "$FRONT_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@v6
        with:
          repository: andrXco/bmpn
          ref: ${{ inputs.backend_sha }}
          path: backend
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: andrXco/bmpn-react
          ref: ${{ inputs.front_sha }}
          path: front
          persist-credentials: false
      - name: Publish the two staging images
        id: images
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag="staging-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          backend="ghcr.io/andrxco/bmpn-deploy-backend:$tag"
          front="ghcr.io/andrxco/bmpn-deploy-front:$tag"
          source="org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          docker buildx build --push --metadata-file backend-image.json --label "$source" -t "$backend" backend
          docker buildx build --push --metadata-file front-image.json --label "$source" -t "$front" front
          printf 'backend=%s@%s\n' "${backend%:*}" "$(jq -er '."containerimage.digest"' backend-image.json)" >> "$GITHUB_OUTPUT"
          printf 'front=%s@%s\n' "${front%:*}" "$(jq -er '."containerimage.digest"' front-image.json)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    runs-on: [self-hosted, Linux, X64, bmpn-staging]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Pull and deploy on the private VM
        env:
          GHCR_TOKEN: ${{ github.token }}
          BACKEND_IMAGE: ${{ needs.publish.outputs.backend }}
          FRONT_IMAGE: ${{ needs.publish.outputs.front }}
        run: bash staging.sh
