name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bmpn
          POSTGRES_USER: bmpn
          POSTGRES_PASSWORD: bmpn_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bmpn -d bmpn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/bmpn
      DB_USERNAME: bmpn
      DB_PASSWORD: bmpn_ci

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v6

      - name: Configurar Java 17 y cache de Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Conservar reportes de pruebas
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Construir, probar y publicar imagen
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v6

      - name: Construir imagen Docker
        run: docker build --pull --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" --label "org.opencontainers.image.revision=${{ github.sha }}" -t bmpn-backend:${{ github.sha }} .

      - name: Probar imagen con PostgreSQL 17
        run: |
          NETWORK="bmpn-ci-${GITHUB_RUN_ID}"
          docker network create "$NETWORK"
          docker run -d --name bmpn-db-smoke --network "$NETWORK" \
            -e POSTGRES_DB=bmpn -e POSTGRES_USER=bmpn -e POSTGRES_PASSWORD=bmpn_ci \
            postgres:17-alpine

          READY=0
          for i in $(seq 1 30); do
            if docker exec bmpn-db-smoke pg_isready -h 127.0.0.1 -U bmpn -d bmpn >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            docker logs bmpn-db-smoke
            exit 1
          fi

          docker run -d --name bmpn-app-smoke --network "$NETWORK" -p 8080:8080 \
            -e DB_URL=jdbc:postgresql://bmpn-db-smoke:5432/bmpn \
            -e DB_USERNAME=bmpn -e DB_PASSWORD=bmpn_ci \
            -e BMPN_JWT_SECRET=ci-smoke-secret-not-for-production-32-bytes-minimum \
            -e BMPN_REFRESH_COOKIE_SECURE=false -e DATOS_INICIALES=false \
            bmpn-backend:${GITHUB_SHA}

          READY=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/v3/api-docs >/dev/null; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            docker logs bmpn-app-smoke
            docker logs bmpn-db-smoke
            exit 1
          fi

          docker rm -f bmpn-app-smoke bmpn-db-smoke
          docker network rm "$NETWORK"

      - name: Iniciar sesion en GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publicar imagen en GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          IMAGE: ghcr.io/andrxco/bmpn
        run: |
          TAGS="sha-${GITHUB_SHA::7}"
          case "$GITHUB_REF" in
            refs/heads/development) TAGS="$TAGS development" ;;
            refs/heads/main) TAGS="$TAGS latest" ;;
            refs/tags/v*) TAGS="$TAGS ${GITHUB_REF_NAME#v}" ;;
          esac
          for TAG in $TAGS; do
            docker tag "bmpn-backend:${GITHUB_SHA}" "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          done

      - name: Empaquetar imagen verificada para staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
        run: |
          docker tag "bmpn-backend:$GITHUB_SHA" "bmpn-release-backend:$GITHUB_SHA"
          docker save "bmpn-release-backend:$GITHUB_SHA" | gzip -1 > image.tar.gz
          sha256sum image.tar.gz > image.tar.gz.sha256
          (( $(stat -c %s image.tar.gz) < 2147483648 ))

      - name: Pasar imagen al job de publicación
        if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
        uses: actions/upload-artifact@v4
        with:
          name: staging-image
          path: |
            image.tar.gz
            image.tar.gz.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  staging-release:
    name: Publicar imagen de staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: staging-image
      - name: Entregar imagen verificada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="staging-$GITHUB_SHA"
          if gh release view "$release" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '[.assets[].name] | sort | join(" ")' | grep -Fxq 'image.tar.gz image.tar.gz.sha256'; then
            exit 0
          fi
          sha256sum --check image.tar.gz.sha256
          gh release create "$release" image.tar.gz image.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Staging $GITHUB_SHA" \
            --notes "Imagen de la rama deploy creada después de pasar el CI."
