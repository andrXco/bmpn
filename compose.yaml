services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bmpn}
      POSTGRES_USER: ${POSTGRES_USER:-bmpn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bmpn_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bmpn_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bmpn}
      DB_USERNAME: ${POSTGRES_USER:-bmpn}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bmpn_local}
    ports:
      - "${APP_PORT:-8080}:8080"
    # La API esta lista cuando responde la documentacion de Swagger
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/v3/api-docs > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Frontend Angular (nginx). Se construye desde la carpeta bmpn-react, al lado de esta
  front:
    build: ${FRONT_DIR:-../bmpn-react}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${FRONT_PORT:-4200}:80"

volumes:
  bmpn_postgres_data:
