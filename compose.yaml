services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bmpn}
      POSTGRES_USER: ${POSTGRES_USER:-bmpn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bmpn_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bmpn_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  bmpn_postgres_data:
