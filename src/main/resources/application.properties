spring.application.name=bmpn

# PostgreSQL local. Los valores pueden reemplazarse con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bmpn}
spring.datasource.username=${DB_USERNAME:bmpn}
spring.datasource.password=${DB_PASSWORD:bmpn_local}

# La estructura de la base debe gestionarse de forma explícita y versionada.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway es la unica fuente de cambios estructurales de PostgreSQL.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
