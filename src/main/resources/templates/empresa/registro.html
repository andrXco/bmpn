<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de empresa</title>
</head>
<body>
<main>
    <h1>Registrar empresa</h1>
    <p>La empresa se creará junto con su administrador inicial.</p>

    <p th:if="${pendienteContrasena}" th:text="${pendienteContrasena}"></p>

    <form th:action="@{/empresas/registro}" th:object="${formulario}" method="post">
        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
        </div>

        <label>NIT <input type="text" th:field="*{nit}"></label>
        <p th:errors="*{nit}"></p>

        <label>Nombre de la empresa <input type="text" th:field="*{nombreEmpresa}"></label>
        <p th:errors="*{nombreEmpresa}"></p>

        <label>Correo de contacto <input type="email" th:field="*{correoContacto}"></label>
        <p th:errors="*{correoContacto}"></p>

        <h2>Administrador inicial</h2>
        <label>Nombre <input type="text" th:field="*{nombreAdministrador}"></label>
        <p th:errors="*{nombreAdministrador}"></p>

        <label>Apellido <input type="text" th:field="*{apellidoAdministrador}"></label>
        <p th:errors="*{apellidoAdministrador}"></p>

        <label>Correo <input type="email" th:field="*{emailAdministrador}"></label>
        <p th:errors="*{emailAdministrador}"></p>

        <label>Contraseña <input type="password" th:field="*{password}"></label>
        <p th:errors="*{password}"></p>

        <button type="submit">Registrar</button>
    </form>
    <a th:href="@{/login}">Ya tengo una cuenta</a>
</main>
</body>
</html>
